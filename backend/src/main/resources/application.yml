server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: testcase-manager
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:testcase_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:tcm}
    password: ${DB_PASSWORD:Tcm@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

tcm:
  ai:
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:60000}
    max-retries: ${AI_MAX_RETRIES:1}
    circuit-failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-open-seconds: ${AI_CIRCUIT_OPEN_SECONDS:60}
    default-token-quota: ${AI_DEFAULT_TOKEN_QUOTA:0}
    alert-threshold: ${AI_ALERT_THRESHOLD:80}
    crypto-secret: ${AI_CRYPTO_SECRET:}
    allow-insecure-crypto: ${AI_ALLOW_INSECURE_CRYPTO:true}
    default-temperature: ${AI_DEFAULT_TEMPERATURE:0.2}
    default-max-tokens: ${AI_DEFAULT_MAX_TOKENS:2000}
    default-base-url: ${AI_DEFAULT_BASE_URL:https://api.openai.com/v1}
    task-pool-size: ${AI_TASK_POOL_SIZE:2}
    task-queue-capacity: ${AI_TASK_QUEUE_CAPACITY:20}
    rate-limit-max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:10}
    rate-limit-window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requirement-length: ${AI_MAX_REQUIREMENT_LENGTH:8000}

logging:
  level:
    root: INFO
    com.pyq.tcm: INFO
